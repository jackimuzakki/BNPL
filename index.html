<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digimap Staff Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF2F1;--card:#fff;--ink:#10272E;--mute:#5E7379;--line:#D5E0DF;--brand:#0E6E6E;--gold:#F0A21F;--ok:#1C8F5A;--bad:#C8473E;--r:16px}
@media(prefers-color-scheme:dark){:root{--bg:#0C1A1E;--card:#13262B;--ink:#E6F0EF;--mute:#8CA4A8;--line:#22393F;--brand:#3CC1B8;--ok:#4CC38A;--bad:#F07268}}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:40px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1080px;margin:auto;padding:0 16px}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--mute)}
input[type=month],input[type=date],input[type=text],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
input[type=month]{width:auto}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px}
nav button{border:0;background:none;padding:8px 16px;border-radius:99px;font-weight:600;color:var(--mute);cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{background:var(--brand);color:#fff}
section{display:none;margin-top:20px}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.lbl{color:var(--mute);font-size:13px;font-weight:500}
h1{font-size:clamp(30px,6vw,48px);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:4px 0}
h2{font-size:16px;font-weight:700;margin-bottom:14px}
.hero{display:grid;gap:20px}
.seg{display:flex;height:16px;border-radius:99px;overflow:hidden;gap:2px}
.seg i{display:block;min-width:3px}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.pc{border-left:4px solid var(--c);padding:4px 0 4px 12px}
.pc b{display:block;font-size:18px;letter-spacing:-.02em}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-top:16px}
.rank{list-style:none;padding:0;display:grid;gap:12px}
.rank li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center}
.rank .n{color:var(--mute);font-weight:700;font-size:13px}
.rank .nm{font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.pct{font-weight:700;font-variant-numeric:tabular-nums}
.rail{position:relative;height:10px;background:var(--line);border-radius:99px}
.rail i{display:block;height:100%;border-radius:99px;background:var(--c)}
.rail b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--gold)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.tile{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13px}
.tile b{display:block;font-size:15px}
.bars{display:flex;align-items:flex-end;gap:3px;height:170px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bar i{width:100%;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px;opacity:.75}
.bar.mx i{opacity:1;background:var(--gold)}
.bar span{font-size:10px;color:var(--mute);margin-top:4px;height:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.av{position:relative;width:52px;height:52px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.av b{font-size:20px;font-weight:800}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
button.av{border:0;padding:0;cursor:pointer;font:inherit}
button.av:hover{box-shadow:0 0 0 3px var(--line)}
.av.big{width:220px;height:220px;margin-bottom:8px}.av.big b{font-size:80px}
dialog{border:0;border-radius:20px;padding:0;background:var(--card);color:var(--ink);width:min(340px,92vw)}
dialog::backdrop{background:rgba(8,20,24,.55)}
.dl{padding:24px;text-align:center;display:grid;gap:4px;justify-items:center}
.dl h2{margin:0}.acts{display:grid;gap:8px;width:100%;margin-top:14px}
[hidden]{display:none!important}
.who{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.who b{display:block;font-size:17px}
.sc .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.sc .head b{font-size:17px}.sc .big{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--c)}
.sc p{font-size:13px;color:var(--mute);margin-top:10px}
.sc p.ok{color:var(--ok)}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.form label{font-size:13px;font-weight:600;display:grid;gap:6px}
.form .full{grid-column:1/-1}
.btn{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--brand);border:1px solid var(--brand)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mute);font-weight:600;font-size:12px;padding:8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.x{background:none;border:0;color:var(--bad);cursor:pointer;font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-top:10px}
svg{width:100%;height:auto;display:block}
@media(max-width:760px){.pgrid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.form{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <div class="brand">Digimap Staff Portal<small>Penjualan partner dan performa promotor</small></div>
    <input type="month" id="month" aria-label="Pilih bulan">
  </div>
  <nav role="tablist">
    <button role="tab" data-t="overview" aria-selected="true">Overview</button>
    <button role="tab" data-t="promotor" aria-selected="false">Performa promotor</button>
    <button role="tab" data-t="input" aria-selected="false">Input harian</button>
  </nav>
</div></header>

<main class="wrap">
  <section id="overview" class="on"></section>
  <section id="promotor"></section>
  <section id="input">
    <div class="card">
      <h2>Input penjualan hari ini</h2>
      <form id="f" class="form" autocomplete="off">
        <label>Partner<select id="fp"></select></label>
        <label>Promotor (SA)<select id="fs"></select></label>
        <label>Tanggal<input type="date" id="fd" required></label>
        <label>Penjualan hari ini (Rp)<input type="text" id="fa" inputmode="numeric" placeholder="contoh: 15.000.000" required></label>
        <div class="full"><button class="btn" type="submit">Simpan penjualan</button></div>
      </form>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="row"><h2 style="margin:0">Input terbaru</h2><button class="btn ghost" id="csv" type="button">Unduh CSV</button></div>
      <div class="tw"><table><thead><tr><th>Tanggal</th><th>Partner</th><th>Promotor</th><th class="r">Penjualan</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
    </div>
  </section>
</main>
<dialog id="dlg" aria-label="Foto promotor"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* Alamat Web App Google Apps Script (database di Google Sheet). Kosongkan untuk mode lokal: data hanya tersimpan di browser. */
const SHEET_URL='https://script.google.com/macros/s/AKfycbzP10pDfToTz-FidLdjbFdT97iyFNR4ctL2ilnnhO_hjMt7xPRO7kADaX1rB7lfwFZlGg/exec';

const P={'Home Credit Indonesia':'#D9485B','Indodana':'#2F6FDE','Akulaku':'#E8821A','Kredivo':'#7B4FD1'};
const S={Dessy:['Home Credit Indonesia',2e8],Fahmi:['Home Credit Indonesia',2e8],Agung:['Akulaku',1.25e8],Feri:['Akulaku',1.25e8],Rozi:['Indodana',2.5e8],Cinda:['Indodana',2e8],Noval:['Kredivo',2.5e8],Ajeng:['Kredivo',1.5e8]};
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const SEED=[[4,'Feri',26166448],[6,'Feri',19161544],[6,'Cinda',9399000],[6,'Agung',80059310],[6,'Noval',48169900],[7,'Ajeng',93827485],[7,'Rozi',59998000],[6,'Fahmi',14909500],[1,'Fahmi',16976500],[7,'Noval',34389000],[7,'Rozi',15999000],[8,'Dessy',10208000],[9,'Noval',15000000],[9,'Noval',26791000],[9,'Fahmi',24290500],[10,'Rozi',29499000],[11,'Rozi',27499000],[11,'Rozi',19499000],[11,'Ajeng',12361390],[12,'Noval',9871000],[13,'Noval',17967000],[13,'Dessy',27408000],[13,'Fahmi',29999000],[11,'Fahmi',25398000],[14,'Cinda',14409000],[14,'Ajeng',25158090],[14,'Cinda',23289000],[14,'Rozi',47957000],[15,'Rozi',24958000],[15,'Feri',26798928],[15,'Dessy',8908500],[15,'Agung',34185008],[15,'Rozi',28499000],[16,'Cinda',26328000],[16,'Dessy',38606000],[17,'Ajeng',17978000],[18,'Rozi',75997000],[19,'Rozi',27499000],[19,'Noval',23178000],[19,'Noval',21719000],[21,'Cinda',29999000],[21,'Rozi',21499000],[24,'Ajeng',26642790],[25,'Noval',15939000]];

const $=s=>document.querySelector(s),ID=new Intl.NumberFormat('id-ID');
const rp=n=>'Rp '+ID.format(Math.round(n));
const sh=n=>n>=1e9?(n/1e9).toFixed(2).replace('.',',')+' M':(n/1e6).toFixed(1).replace('.',',')+' jt';
const pc=p=>(p*100).toFixed(1).replace('.',',')+'%';
const KEY='digimap_daily_v1';
const FK='digimap_foto_v1';let PH={};try{PH=JSON.parse(localStorage.getItem(FK))||{}}catch(e){}
function savePH(){try{localStorage.setItem(FK,JSON.stringify(PH))}catch(e){}}
let rows=SHEET_URL?[]:load(),month=new Date().toLocaleDateString('sv-SE').slice(0,7);

function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(v))return v}catch(e){}
  return SEED.map((r,i)=>({id:'s'+i,ts:'',d:'2026-11-'+String(r[0]).padStart(2,'0'),sa:r[1],amt:r[2]}))}
function save(){if(SHEET_URL)return;try{localStorage.setItem(KEY,JSON.stringify(rows))}catch(e){}}

function agg(m){const a={staff:{},partner:{},day:{},total:0};
  rows.filter(r=>r.d.startsWith(m)).forEach(r=>{const p=S[r.sa][0],d=+r.d.slice(8);
    a.staff[r.sa]=(a.staff[r.sa]||0)+r.amt;a.partner[p]=(a.partner[p]||0)+r.amt;a.day[d]=(a.day[d]||0)+r.amt;a.total+=r.amt});
  Object.keys(P).forEach(p=>a.partner[p]=a.partner[p]||0);return a}

function overview(){const a=agg(month),[y,m]=month.split('-').map(Number),tt=Object.values(S).reduce((s,x)=>s+x[1],0);
  const list=Object.entries(S).map(([n,[p,t]])=>({n,p,t,v:a.staff[n]||0,pct:(a.staff[n]||0)/t})).sort((x,y)=>y.pct-x.pct);
  const byVal=[...list].sort((x,y)=>y.v-x.v),top=list[0],low=list[list.length-1];
  const dim=new Date(y,m,0).getDate(),now=new Date().toLocaleDateString('sv-SE'),last=month===now.slice(0,7)?+now.slice(8):dim;
  const mx=Math.max(0,...Object.values(a.day));let bars='';
  for(let d=1;d<=last;d++){const v=a.day[d]||0;bars+=`<div class="bar${v&&v===mx?' mx':''}" title="Tgl ${d}: ${rp(v)}"><i style="height:${mx?v/mx*100:0}%"></i><span>${d%5===0||d===1?d:''}</span></div>`}
  const seg=Object.keys(P).map(p=>`<i style="flex:${a.partner[p]||0.001};background:${P[p]}"></i>`).join('');
  const pcs=Object.keys(P).map(p=>`<div class="pc" style="--c:${P[p]}"><span class="lbl">${p}</span><b>${sh(a.partner[p])}</b><span class="lbl">${a.total?pc(a.partner[p]/a.total):'0%'} dari total</span></div>`).join('');
  const rk=list.map((x,i)=>`<li><span class="n">${i+1}</span><div><div class="nm"><span class="dot" style="--c:${P[x.p]}"></span>${x.n}</div><div class="rail" style="--c:${P[x.p]}"><i style="width:${Math.min(100,x.pct*100)}%"></i></div></div><span class="pct">${pc(x.pct)}</span></li>`).join('');
  $('#overview').innerHTML=`<div class="card hero"><div><p class="lbl">Total penjualan ${BLN[m-1]} ${y}</p><h1>${rp(a.total)}</h1><p class="lbl">${pc(a.total/tt)} dari target toko ${rp(tt)}</p></div><div class="seg">${seg}</div></div>
  <div class="pgrid">${pcs}</div>
  <div class="two"><div class="card"><h2>Peringkat promotor (% target)</h2><ol class="rank">${rk}</ol>
    <div class="tiles"><div class="tile">🥇 Persentase tertinggi<b>${top.n} ${pc(top.pct)}</b></div><div class="tile">🥉 Persentase terendah<b>${low.n} ${pc(low.pct)}</b></div><div class="tile">🥇 Nilai tertinggi<b>${byVal[0].n} ${sh(byVal[0].v)}</b></div><div class="tile">🥉 Nilai terendah<b>${byVal[byVal.length-1].n} ${sh(byVal[byVal.length-1].v)}</b></div></div></div>
  <div class="card"><h2>Penjualan per hari</h2><div class="bars">${bars}</div><p class="lbl" style="margin-top:10px">${mx?'Hari tertinggi: '+rp(mx):'Belum ada data bulan ini'}</p></div></div>`;
  return {list,a}}

/* Foto promotor: taruh file di folder foto/ pada repo, nama huruf kecil, contoh foto/dessy.jpg. Jika belum ada, tampil inisial. */
const dlg=$('#dlg');
function srcOf(n){return PH[n]!==undefined?PH[n]:`foto/${n.toLowerCase()}.jpg`}
function ava(n,c){const f=srcOf(n);
  return `<button type="button" class="av" data-av="${n}" style="--c:${c}" aria-label="Lihat foto ${n}"><b>${n[0]}</b>${f?`<img src="${f}" alt="" onerror="this.remove()">`:''}</button>`}
function openAv(n){const c=P[S[n][0]],f=srcOf(n);
  dlg.innerHTML=`<div class="dl"><div class="av big" style="--c:${c}"><b>${n[0]}</b>${f?`<img src="${f}" alt="Foto ${n}" onerror="this.remove();var d=document.getElementById('dDel');if(d)d.hidden=true">`:''}</div><h2>${n}</h2><p class="lbl">${S[n][0]}</p><div class="acts"><button class="btn" id="dChg" type="button">Ganti foto</button><button class="btn ghost" id="dDel" type="button"${f?'':' hidden'}>Hapus foto</button><button class="btn ghost" id="dX" type="button">Tutup</button></div><input type="file" id="dFile" accept="image/*" hidden></div>`;
  $('#dX').onclick=()=>dlg.close();
  $('#dChg').onclick=()=>$('#dFile').click();
  $('#dFile').onchange=e=>{const f=e.target.files[0];if(f)setFoto(n,f)};
  $('#dDel').onclick=()=>{if(!confirm('Hapus foto '+n+'?'))return;putFoto(n,'');toast('Foto '+n+' dihapus')};
  dlg.showModal()}
function putFoto(n,d){PH[n]=d;savePH();render();dlg.close();
  if(SHEET_URL)sync(()=>post({action:'foto',sa:n,data:d}),()=>toast('Perubahan foto belum tersimpan di server'))}
function setFoto(n,f){const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const c=document.createElement('canvas'),z=300,m=Math.min(im.width,im.height);c.width=c.height=z;
    c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);URL.revokeObjectURL(u);
    let d=c.toDataURL('image/jpeg',.72);if(d.length>44000)d=c.toDataURL('image/jpeg',.5);
    putFoto(n,d);toast('Foto '+n+' diperbarui')};
  im.onerror=()=>{dlg.close();toast('File bukan gambar yang valid')};im.src=u}
function promotor(){const a=agg(month),list=Object.entries(S).map(([n,[p,t]])=>({n,p,t,v:a.staff[n]||0,pct:(a.staff[n]||0)/t})).sort((x,y)=>y.pct-x.pct);
  const sc=Math.max(1,...list.map(x=>x.pct));
  $('#promotor').innerHTML='<div class="cards">'+list.map(x=>{const gap=x.t-x.v;return `<div class="card sc" style="--c:${P[x.p]}"><div class="who">${ava(x.n,P[x.p])}<div><b>${x.n}</b><span class="lbl">${x.p}</span></div></div><div class="big">${pc(x.pct)}</div><div class="rail" style="margin-top:10px"><i style="width:${x.pct/sc*100}%"></i><b style="left:${100/sc}%"></b></div><p>${rp(x.v)} dari ${rp(x.t)}</p><p class="${gap<=0?'ok':''}">${gap>0?'Sisa target '+rp(gap):'Target tercapai, lebih '+rp(-gap)}</p></div>`}).join('')+'</div><p class="lbl" style="margin-top:12px">Garis kuning menandai 100% target.</p>'}

function table(){const r=[...rows].sort((a,b)=>b.d.localeCompare(a.d)||String(b.ts).localeCompare(String(a.ts))).slice(0,20);
  $('#tb').innerHTML=r.map(x=>`<tr><td>${x.d.split('-').reverse().join('/')}</td><td>${S[x.sa][0]}</td><td>${x.sa}</td><td class="r">${rp(x.amt)}</td><td class="r"><button class="x" data-id="${x.id}" aria-label="Hapus input ${x.sa}">Hapus</button></td></tr>`).join('')||'<tr><td colspan="5">Belum ada input. Isi form di atas untuk mulai.</td></tr>'}

async function pull(){if(!SHEET_URL)return;
  try{const r=await fetch(SHEET_URL+'?t='+Date.now()),j=await r.json();rows=j.rows.filter(x=>S[x.sa]);if(j.photos){PH=j.photos;savePH()}render()}
  catch(e){toast('Gagal memuat data dari Google Sheet')}}
async function post(o){const r=await fetch(SHEET_URL,{method:'POST',body:JSON.stringify(o)}),j=await r.json();if(!j.ok)throw new Error(j.error)}
function render(){overview();promotor();table()}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}

/* form */
$('#fp').innerHTML=Object.keys(P).map(p=>`<option>${p}</option>`).join('');
function fillSA(){$('#fs').innerHTML=Object.keys(S).filter(n=>S[n][0]===$('#fp').value).map(n=>`<option>${n}</option>`).join('')}
fillSA();$('#fp').onchange=fillSA;
$('#fd').value=new Date().toLocaleDateString('sv-SE');
$('#fa').oninput=e=>{const d=e.target.value.replace(/\D/g,'');e.target.value=d?ID.format(+d):''};
/* Simpan dan hapus langsung tampil di layar, sinkron ke Google Sheet berjalan di latar belakang */
let pending=0,q=Promise.resolve();
function sync(task,fail){pending++;
  q=q.then(task).catch(()=>fail&&fail()).then(()=>{pending--;if(!pending)pull()})}
$('#f').onsubmit=e=>{e.preventDefault();
  const amt=+$('#fa').value.replace(/\D/g,'');if(!amt){toast('Isi nominal penjualan dulu');return}
  const r={id:'u'+Date.now(),ts:new Date().toISOString(),d:$('#fd').value,sa:$('#fs').value,amt};
  rows.push(r);
  if(SHEET_URL)sync(()=>post({action:'add',partner:S[r.sa][0],tanggal:r.d,sa:r.sa,sales:amt}),()=>toast('Gagal menyimpan, coba lagi'));
  else save();
  month=r.d.slice(0,7);$('#month').value=month;$('#fa').value='';render();toast('Penjualan tersimpan')};
$('#tb').onclick=e=>{const id=e.target.dataset.id;if(!id||!confirm('Hapus input ini?'))return;
  if(SHEET_URL&&(pending||id[0]==='u')){toast('Sedang menyinkronkan, coba lagi sebentar');return}
  rows=rows.filter(r=>r.id!==id);render();toast('Input dihapus');
  if(SHEET_URL)sync(()=>post({action:'del',id}),()=>toast('Gagal menghapus, coba lagi'));else save()};
$('#promotor').addEventListener('click',e=>{const b=e.target.closest('[data-av]');if(b)openAv(b.dataset.av)});
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
$('#csv').onclick=()=>{const L=['Timestamp,Partner,Tanggal,SA,Sales Today',...rows.map(r=>[r.ts,S[r.sa][0],r.d,r.sa,r.amt].join(','))];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.join('\n')],{type:'text/csv'}));a.download='daily-sales.csv';a.click()};

/* nav */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));
  document.querySelectorAll('main section').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t));scrollTo(0,0);centerTab(b)});
function centerTab(b){const n=b.parentElement,br=b.getBoundingClientRect(),nr=n.getBoundingClientRect();
  n.scrollBy({left:br.left-nr.left-(nr.width-br.width)/2,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}
$('#month').value=month;$('#month').onchange=e=>{if(e.target.value){month=e.target.value;render()}};
render();pull();
</script>
</body>
